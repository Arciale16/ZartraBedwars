name: M01 Governance

on:
  pull_request:
  push:
    branches: [main, agent/milestone-01-foundation]

permissions:
  contents: read

concurrency:
  group: m01-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-governance:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out immutable source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install pinned validator runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.12.13
      - name: Run all Milestone 1 validators and tests
        run: python tools/validation/run_m01_validation.py

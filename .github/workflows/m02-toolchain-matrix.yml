name: M02 Java Toolchain Matrix

on:
  pull_request:
  push:
    branches: [main, agent/milestone-02-public-api-domain]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m02-toolchains-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-reactor:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        jdk: ['8', '11', '16', '17', '21']
    steps:
      - name: Check out immutable source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install pinned validator runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.12.13
      - name: Install checksum-locked Temurin toolchain
        run: python tools/build/install_jdk.py --id "${{ matrix.jdk }}" --github-env "$GITHUB_ENV" --github-path "$GITHUB_PATH"
      - name: Restore checksum-locked Maven repository
        run: python tools/dependencies/maven_lock.py restore
      - name: Build and test M02 from a clean workspace
        run: python tools/build/clean_build.py --jdk "${{ matrix.jdk }}"
